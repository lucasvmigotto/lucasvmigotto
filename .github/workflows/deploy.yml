name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build and Deploy to lucasvmigotto/me
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Set version
        id: version
        run: echo "VERSION=v$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Deploy to lucasvmigotto/me
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ steps.version.outputs.VERSION }} — $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push --force "https://x-access-token:${{ secrets.PAT_GH_ME_REP }}@github.com/lucasvmigotto/me.git" main

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
