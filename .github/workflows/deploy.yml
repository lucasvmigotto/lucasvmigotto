name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint, typecheck, test, build)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan release (bump package.json from commit history)
        id: release
        run: |
          set +e
          VERSION=$(bun scripts/release.ts)
          CODE=$?
          set -e
          case "$CODE" in
            0) RELEASED=true ;;
            3) RELEASED=false ;;
            *) exit "$CODE" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "released=${RELEASED}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_APP_SITE_NAME: ${{ vars.VITE_APP_SITE_NAME }}

      - name: Create archive
        run: tar -cjf dist.tar.bz2 dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.release.outputs.version }}
          path: |
            dist/
            dist.tar.bz2
          retention-days: 7
          if-no-files-found: error

  cd:
    name: CD (deploy to Cloudflare R2, tag, release)
    runs-on: ubuntu-26.04
    needs: [ci]
    permissions:
      contents: write
    environment:
      name: production
      url: https://lucasvmigotto.me

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.ci.outputs.version }}
          path: .

      - name: Validate R2 endpoint
        run: |
          ENDPOINT="${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}"
          if [ -z "$ENDPOINT" ]; then
            echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"
            exit 1
          fi
          case "$ENDPOINT" in
            https://*) echo "R2 endpoint OK: $ENDPOINT" ;;
            *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $ENDPOINT)"; exit 1 ;;
          esac

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          fi
          aws --version

      - name: Sync static site to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          ENDPOINT="${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}"
          BUCKET="${{ vars.CLOUDFLARE_R2_BUCKET_ID }}"
          aws s3 sync dist/ "s3://${BUCKET}" \
            --endpoint-url "${ENDPOINT}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Bump package.json to the release version
        if: ${{ needs.ci.outputs.released == 'true' }}
        run: bun scripts/release.ts

      - name: Commit and tag the release
        if: ${{ needs.ci.outputs.released == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898496+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.ci.outputs.version }}"
          git add package.json
          git commit -m "chore(release): $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$VERSION"

      - name: Create release
        if: ${{ needs.ci.outputs.released == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.ci.outputs.version }}
          name: v${{ needs.ci.outputs.version }}
          files: dist.tar.bz2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
