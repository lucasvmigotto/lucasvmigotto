name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build and Deploy to ${{ github.actor }}/me
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Create archive
        run: tar -cjf dist.tar.bz2 dist/

      - name: Set version
        id: version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Deploy to ${{ github.actor }}/me
        run: |
          cd dist
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: v${{ steps.version.outputs.VERSION }}" || true
          git push --force "https://x-access-token:${{ secrets.PAT_GH_ME_REP }}@github.com/${{ github.actor }}/me.git" main

      - name: Create tag
        run: |
          git tag -f ${{ steps.version.outputs.VERSION }}
          git push --force origin ${{ steps.version.outputs.VERSION }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: dist.tar.bz2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
